<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>

    <link rel="stylesheet" href="styling.css">
    <link rel="stylesheet" href="calc.css">
</head>
<body style="font-family: Arial; display: flex; align-items: center; flex-direction: column; background-color: #638e8e;overflow: hidden; ">
<p class="c-title">Online Calculator</p>

<main class="c-body">

    <div class="search">
        <input class="bar" type="text" placeholder="Search">
        <img src="free-search-icon-2911-thumb.png" class="icon">
        <a href="https://www.instagram.com/ibrahashhash/?next=%2F" target="_blank" class="contact">Contact us</a>
    </div>

    <input type="text" class="output" placeholder="Result" disabled>

    <div id="but-body">
        <div class="ok">

            <div class="col">
                <button class="numbers">7</button>
                <button class="numbers">4</button>
                <button class="numbers">1</button>
                <button class="numbers">0</button>
                <button class="numbers" id="dots"> <div id="dot"> </div> </button>

            </div>

            <div class="col">
                <button class="numbers">8</button>
                <button class="numbers">5</button>
                <button class="numbers">2</button>
                <button class="numbers" id="delete">ESC</button>
                <button class="numbers">&#x221A;</button>


            </div>

            <div class="col">
                <button class="numbers">9</button>
                <button class="numbers">6</button>
                <button class="numbers">3</button>
                <button class="numbers">=</button>
                <button class="numbers">&#x25;</button>

            </div>

            <div class="col">
                <button class="numbers">+</button>
                <button class="numbers">/</button>
                <button class="numbers" id="multi">*</button>
                <button class="numbers">-</button>
                <button class="numbers" id="square"> X<sup>2</sup></button>

                <div class="info"><p> fx35333 </p></div>
            </div>
        </div>
    </div>

</main>

<div>
    <button class="mode active">Basic</button>
    <button class="mode">Scientific</button>
    <button class="mode">Graphing</button>
    <button class="mode">Financial</button>
</div>
</body>
</html>
